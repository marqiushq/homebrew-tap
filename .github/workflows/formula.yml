# Keeps the formula on the latest release of marqius-wkhtmltopdf, and proves it works first:
#
#   every hour     when marqius.com's latest release is newer than the formula, each new build is
#                  checked against its published checksum, then installed, tested and audited on
#                  Linux (x86-64 and ARM64) and on macOS (Apple silicon); it is committed once Linux
#                  passes and macOS has not failed (GitHub's Macs are often all taken: a macOS job
#                  GitHub never starts does not hold a release back; a macOS test that runs and fails
#                  does). The macOS tests run on macOS 26, whose machines GitHub supplies far more
#                  readily than macOS 15's; setting the repository variable MACOS_TESTS to "off"
#                  turns them off, should GitHub run short of those too
#   every day      the formula as it stands is installed, tested and audited on the same three
#                  again, so a change on marqius.com, in Homebrew or at GitHub shows within a day
#   by hand        Actions > Formula > Run workflow: follows a new release if there is one, and
#                  tests on all three either way
#   on a change    to main, or in a pull request: the formula as it stands, on the same three
name: Formula

on:
  schedule:
    - cron: "17 * * * *" # every hour: follow a new release
    - cron: "47 5 * * *" # every day: test the formula as it stands
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearsal: install, test and audit the formula for the latest release on Linux; commit nothing"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # a rehearsal neither waits behind a run that publishes nor takes its place
  group: formula-${{ github.ref }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.follow.outputs.changed }}
      version: ${{ steps.follow.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: follow
        name: Follow marqius.com's latest release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 .github/follow-release.py
      - if: steps.follow.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formula
          path: Formula/marqius-wkhtmltopdf.rb
          retention-days: 7

  test:
    needs: follow
    name: test (${{ matrix.runner }})
    if: >-
      needs.follow.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' || github.event.schedule == '47 5 * * *'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # taps this repository as marqiushq/tap from the working copy, which it first resets to the commit
      - uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # main, 2026-11-20
      # so a new release's formula is put in place after it, not before
      - if: needs.follow.outputs.changed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula
          path: Formula
      - name: Install, test and audit
        env:
          WANT: ${{ needs.follow.outputs.version }}
        run: |
          formula="$(brew --repository marqiushq/tap)/Formula/marqius-wkhtmltopdf.rb"
          want="${WANT:-$(sed -n 's/^  version "\(.*\)"$/\1/p' "$formula")}"
          echo "Testing marqius-wkhtmltopdf $want"
          grep -q "^  version \"$want\"$" "$formula"
          brew install --formula marqiushq/tap/marqius-wkhtmltopdf
          brew test marqiushq/tap/marqius-wkhtmltopdf
          brew audit --strict --online --formula marqiushq/tap/marqius-wkhtmltopdf
          test "$(marqius-wkhtmltopdf --version)" = "marqius-wkhtmltopdf $want"
          "$(brew --prefix)/opt/marqius-wkhtmltopdf/libexec/bin/wkhtmltopdf" -V | grep -q "marqius-wkhtmltopdf $want"


  test-macos:
    needs: follow
    # a Mac GitHub never supplies must not hold a release back; "macos-result" below fails the run when macOS
    # ran and failed. Off when MACOS_TESTS is "off" (Settings > Secrets and variables > Actions > Variables)
    continue-on-error: true
    outputs:
      started: ${{ steps.started.outputs.started }}
      passed: ${{ steps.passed.outputs.passed }}
    # (a rehearsal leaves it out: GitHub often has no Mac to give, and a rehearsal commits nothing)
    if: >-
      vars.MACOS_TESTS != 'off' && !inputs.dry_run && (needs.follow.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' || github.event.schedule == '47 5 * * *')
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - id: started
        run: echo "started=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # taps this repository as marqiushq/tap from the working copy, which it first resets to the commit
      - uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # main, 2026-11-20
      # so a new release's formula is put in place after it, not before
      - if: needs.follow.outputs.changed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula
          path: Formula
      - name: Install, test and audit
        env:
          WANT: ${{ needs.follow.outputs.version }}
        run: |
          formula="$(brew --repository marqiushq/tap)/Formula/marqius-wkhtmltopdf.rb"
          want="${WANT:-$(sed -n 's/^  version "\(.*\)"$/\1/p' "$formula")}"
          echo "Testing marqius-wkhtmltopdf $want"
          grep -q "^  version \"$want\"$" "$formula"
          brew install --formula marqiushq/tap/marqius-wkhtmltopdf
          brew test marqiushq/tap/marqius-wkhtmltopdf
          brew audit --strict --online --formula marqiushq/tap/marqius-wkhtmltopdf
          test "$(marqius-wkhtmltopdf --version)" = "marqius-wkhtmltopdf $want"
          "$(brew --prefix)/opt/marqius-wkhtmltopdf/libexec/bin/wkhtmltopdf" -V | grep -q "marqius-wkhtmltopdf $want"
      - id: passed
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  # the macOS test ran on a Mac and did not pass: the run fails, as a Linux failure would
  macos-result:
    needs: test-macos
    if: always() && needs.test-macos.outputs.started == 'true' && needs.test-macos.outputs.passed != 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "The macOS test ran and did not pass: see the test-macos job."
          exit 1


  publish:
    needs: [follow, test, test-macos]
    # Linux must pass; macOS must pass whenever GitHub gave it a Mac; a run cancelled by hand publishes nothing
    if: >-
      always() && !cancelled() && needs.follow.outputs.changed == 'true' && github.ref == 'refs/heads/main' && !inputs.dry_run &&
      needs.test.result == 'success' && (needs.test-macos.outputs.started != 'true' || needs.test-macos.outputs.passed == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula
          path: Formula
      - name: Commit the release that passed
        env:
          VERSION: ${{ needs.follow.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          grep -q "^  version \"$VERSION\"$" Formula/marqius-wkhtmltopdf.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/marqius-wkhtmltopdf.rb
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "marqius-wkhtmltopdf $VERSION" -m "Installed, tested and audited on macOS (Apple silicon) and Linux (x86-64, ARM64): $RUN_URL"
          git push -q origin HEAD:main
